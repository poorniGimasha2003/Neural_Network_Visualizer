<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Neural Network Visualizer</h1>
    <p>A feedforward neural network learning to separate two classes — built from scratch in JavaScript, no ML libraries.</p>
  </header>

  <main>
    <div class="canvas-container">
      <canvas id="nn-canvas" width="500" height="500"></canvas>
    </div>

    <div class="controls">
      <div class="control-row">
        <button id="play-btn">Play</button>
        <button id="step-btn">Step</button>
        <button id="reset-btn">Reset</button>
      </div>

      <div class="control-row">
        <label for="lr-slider">Learning rate: <span id="lr-value">0.05</span></label>
        <input type="range" id="lr-slider" min="0.001" max="0.3" step="0.001" value="0.05">
      </div>

      <div class="control-row">
        <span id="epoch-label">Epoch: 0</span>
      </div>

      <div class="loss-container">
        <p>Loss over time</p>
        <canvas id="loss-canvas" width="300" height="100"></canvas>
      </div>
    </div>
  </main>

  <footer>
    <p>Built by Poorni Pathirage — <a href="https://github.com/poorniGimasha2003/Neural_Network_Visualizer" target="_blank">source on GitHub</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/neuralnet.js"></script>
  <script src="js/visualize.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
